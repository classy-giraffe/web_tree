[package]
name = "web_tree"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12.15", features = ["json"] }
scraper = "0.23.1"
url = "2.5.4"
tokio = { version = "1.44.2", features = ["full"] }
petgraph = "0.8.1"
futures = "0.3.31"
clap = { version = "4.5.3", features = ["derive"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3